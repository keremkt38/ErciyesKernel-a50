name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [a50]
    steps:
    - name: Repo'yu klonla
      uses: actions/checkout@v4
      with:
        fetch-depth: 10

    - name: Free disk space (1/3)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main
      with:
        retain: 'compiler_cmake'

    - name: Gerekli bağımlılıkları yükle
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make \
          python3 python-is-python3 git zip unzip \
          ccache libncurses5-dev libncursesw5-dev \
          clang lld llvm llvm-dev wget curl

    - name: KernelSU-Next Entegre Et
      run: |
        curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.0.0-30-legacy

    - name: Kernel build et (${{ matrix.device }})
      run: |
        chmod +x b.sh
        ./b.sh

    - name: AnyKernel3 indir ve paketle
      run: |
        git clone https://github.com/SamsungProject1/AnyKernel3.git

        OUT_NAME="ErciyesKernel_${{ matrix.device }}_${{ github.run_number }}"

        # Kernel image kopyala
        cp AK3/Image AnyKernel3/

        cd AnyKernel3
        zip -r "${OUT_NAME}.zip" ./*
        mv "${OUT_NAME}.zip" ..
        cd ..

    - name: Telegram'a gönder
      run: |
        FILE="ErciyesKernel_${{ matrix.device }}_${{ github.run_number }}.zip"

        curl -F document=@"$FILE" \
             -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
             https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

             
